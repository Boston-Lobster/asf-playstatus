name: Test and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: asf-playstatus-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Build against ASF 6.3.8.4
        shell: pwsh
        run: ./build.ps1
      - name: Run regression harness
        shell: pwsh
        run: |
          dotnet run --project tests/AsfPlayStatus.RegressionHarness/AsfPlayStatus.RegressionHarness.csproj
          if ($LASTEXITCODE -ne 0) { throw "Regression harness failed with exit code $LASTEXITCODE" }
      - run: python scripts/package_release.py --version

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Build release assembly
        shell: pwsh
        run: ./build.ps1
      - name: Package release
        run: python scripts/package_release.py
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v$(python scripts/package_release.py --version)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already has a GitHub release; skipping."
            exit 0
          fi
          if git ls-remote --exit-code origin "refs/tags/$tag" "refs/tags/$tag^{}" >/dev/null 2>&1; then
            echo "$tag already exists; skipping to preserve the existing tag."
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --notes-file dist/release-notes.md dist/*.zip dist/SHA256SUMS
